<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        #map { height: 500px; width: 100%; }
    </style>
</head>
<body>
    <h2>Recommended Places Map</h2>
    <button onclick="fetchLocations()">Show Locations</button>
    <div id="map"></div>
    
    <script>
        // Initialize the map
        var map = L.map('map').setView([20.5937, 78.9629], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Function to fetch and plot locations
        function fetchLocations() {
            const payload = {
                recommended_places: ["Raj Art Gallery Pune", "Top Art Gallery"]
            };
        
            $.ajax({
                url: "/get_locations",
                type: "POST",
                contentType: "application/json",  // Must be set for JSON data
                data: JSON.stringify(payload),
                success: function(data) {
                    console.log("Success:", data);
                    
                    // Clear existing markers
                    map.eachLayer(layer => {
                        if (layer instanceof L.Marker) {
                            map.removeLayer(layer);
                        }
                    });
                
                    // Add new markers
                    if (data.length > 0) {
                        let markers = [];
                        data.forEach(location => {
                            const marker = L.marker([location.latitude, location.longitude])
                                .addTo(map)
                                .bindPopup(location.name);
                            markers.push(marker.getLatLng());
                        });
                        map.fitBounds(L.latLngBounds(markers));
                    } else {
                        alert("No locations found!");
                    }
                },
                error: function(xhr) {
                    console.error("Error:", xhr.status, xhr.responseText);
                    alert("Failed to fetch data. Check console.");
                }
            });
        }
    </script>
</body>
</html>
