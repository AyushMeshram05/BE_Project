<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url("https://picsum.photos/1600/900") no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        .hidden { display: none; }
    </style>

    <!-- Google Sign-In API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta name="google-signin-client_id" content="706372573975-5qk0q56c07p12hddpknv1cu6a448d1hf.apps.googleusercontent.com">
</head>
<body>

    <!-- Sign In Form -->
    <div class="form-container" id="signInForm">
        <h2 class="text-center">Sign In</h2>
        <form id="signinForm">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <div class="mb-3 text-end">
                <a href="#" onclick="toggleForms('forgotPasswordForm')">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
            <div class="text-center mt-3">
                <p>Don't have an account? <a href="#" onclick="toggleForms('signUpForm')">Sign Up</a></p>
            </div>
        </form>

        <!-- Google Sign-In button -->
        <div id="g_id_onload"
            data-client_id="706372573975-5qk0q56c07p12hddpknv1cu6a448d1hf.apps.googleusercontent.com"
            data-context="signin"
            data-ux_mode="popup"
            data-callback="onSignIn"
            data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <!-- Sign Up Form -->
    <div class="form-container hidden" id="signUpForm">
        <h2 class="text-center">Sign Up</h2>
        <form id="signupForm">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Sign Up</button>
            <div class="text-center mt-3">
                <p>Already have an account? <a href="#" onclick="toggleForms('signInForm')">Sign In</a></p>
            </div>
        </form>
    </div>

    <!-- Forgot Password Form -->
    <div class="form-container hidden" id="forgotPasswordForm">
        <h2 class="text-center">Forgot Password</h2>
        <form id="forgotPassword">
            <div class="mb-3">
                <label class="form-label">Enter your email</label>
                <input type="email" class="form-control" name="email" required>
            </div>
            <button type="submit" class="btn btn-warning w-100">Reset Password</button>
            <div class="text-center mt-3">
                <p><a href="#" onclick="toggleForms('signInForm')">Back to Sign In</a></p>
            </div>
        </form>
    </div>

    <script>
        // Toggle Forms
        function toggleForms(formId) {
            document.getElementById('signInForm').classList.add('hidden');
            document.getElementById('signUpForm').classList.add('hidden');
            document.getElementById('forgotPasswordForm').classList.add('hidden');
            document.getElementById(formId).classList.remove('hidden');
        }

        // Sign Up
        document.getElementById('signupForm').addEventListener('submit', function(event) {
            event.preventDefault();
            let formData = new FormData(this);

            fetch('/signup', { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                alert(data.success ? "Registered Successfully!" : data.error);
                if (data.success) toggleForms('signInForm');
            })
            .catch(error => console.error("Error:", error));
        });

        // Sign In
        document.getElementById('signinForm').addEventListener('submit', function(event) {
            event.preventDefault();
            let formData = new FormData(this);

            fetch('/signin', { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                alert(data.success ? "Login Successful!" : data.error);
                if (data.success) window.location.href = "/recommendation";
            })
            .catch(error => console.error("Error:", error));
        });

        // Google Sign-In
        function onSignIn(response) {
            if (response.credential) {
                fetch('/google-login', {
                    method: 'POST',
                    body: JSON.stringify({ token: response.credential }),
                    headers: { 'Content-Type': 'application/json' }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) window.location.href = "/recommendation";
                    else console.error("Google Sign-In failed:", data.error);
                })
                .catch(error => console.error("Error:", error));
            } else {
                console.error("No credential received.");
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
